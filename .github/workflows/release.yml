name: Release

# Builds the installers people download and publishes them as a draft GitHub
# Release (docs/RELEASING.md, ADR 0072). A version tag on main starts it:
#
#   node scripts/set-version.mjs 0.1.0   # commit, merge to main, then:
#   git tag v0.1.0 && git push origin v0.1.0
#
# "Run workflow" builds everything the same way but publishes nothing: the
# installers stay on the run as workflow artifacts (a dry run, e.g. to check the
# Apple signing secrets before a real tag).
#
# The installers carry no self-test harness (no --features devtools), so they
# are not run here; the Bundles workflow runs the same build with the harness on
# every push to main, and a tag must point at a commit on main.
#
# macOS: signed with your Developer ID and notarized when the APPLE_* secrets are
# set, unsigned (with a warning) when none are. Windows and Linux: unsigned until
# a Windows certificate exists (PROGRESS.md, item 17).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # Changes to the release machinery build it once (signed, if the secrets are
  # set) without publishing anything.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/release-notes.md"
      - "scripts/set-version.mjs"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # A tag's run is never cut short; a newer push to a pull request replaces its run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  prepare:
    name: Version and tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: One version everywhere, matching the tag
        id: version
        run: |
          version="$(node scripts/set-version.mjs --check)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the app's version $version (node scripts/set-version.mjs <version>)."
              exit 1
            fi
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main. Merge first, then tag main."
              exit 1
            fi
          fi
          echo "Mirsam $version"

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # One disk image for every Mac (Apple silicon and Intel).
          - { name: macOS, os: macos-latest, target: universal-apple-darwin }
          - { name: Windows, os: windows-latest, target: x86_64-pc-windows-msvc }
          # The oldest supported Ubuntu: its packages run on newer distributions.
          - { name: Linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      # linuxdeploy (AppImage bundling) is itself an AppImage; runners have no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential file patchelf \
            rpm2cpio cpio libarchive-tools

      - name: Rust targets
        run: |
          rustup show
          case "$TARGET" in
            universal-apple-darwin) rustup target add aarch64-apple-darwin x86_64-apple-darwin ;;
            *) rustup target add "$TARGET" ;;
          esac
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop

      # The certificate goes into a keychain of this run's own; `tauri build`
      # signs with APPLE_SIGNING_IDENTITY from it and notarizes and staples the
      # app with the APPLE_API_* (or APPLE_ID) variables.
      - name: Apple signing (macOS)
        id: signing
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          ID: ${{ secrets.APPLE_ID }}
          PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$CERTIFICATE" ]]; then
            echo "::warning::No APPLE_CERTIFICATE secret: the macOS app is unsigned and Gatekeeper will block it (docs/RELEASING.md)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A signed app that is not notarized is still blocked, so both or neither.
          if [[ -n "$API_KEY" && -n "$API_ISSUER" && -n "$API_PRIVATE_KEY" ]]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$API_PRIVATE_KEY" > "$key"
            { echo "APPLE_API_KEY=$API_KEY"; echo "APPLE_API_ISSUER=$API_ISSUER"; echo "APPLE_API_KEY_PATH=$key"; } >> "$GITHUB_ENV"
          elif [[ -n "$ID" && -n "$PASSWORD" && -n "$TEAM_ID" ]]; then
            { echo "APPLE_ID=$ID"; echo "APPLE_PASSWORD=$PASSWORD"; echo "APPLE_TEAM_ID=$TEAM_ID"; } >> "$GITHUB_ENV"
          else
            echo "::error::APPLE_CERTIFICATE is set but notarization is not: set APPLE_API_KEY, APPLE_API_ISSUER and APPLE_API_PRIVATE_KEY (or APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID)."
            exit 1
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')"
          if [[ -z "$identity" ]]; then
            echo "::error::The certificate in APPLE_CERTIFICATE is not a Developer ID Application certificate (found: $(security find-identity -v -p codesigning "$keychain" | grep -o '"[^"]*"' | tr '\n' ' '))."
            exit 1
          fi
          echo "Signing as $identity"
          { echo "APPLE_SIGNING_IDENTITY=$identity"; echo "SIGNING_KEYCHAIN=$keychain"; } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build and check the installers
        run: node scripts/bundle.mjs --target "$TARGET"

      # Tauri signs, notarizes and staples the .app; check that it did all of
      # it, PDFium included, then do the same for the disk image around it.
      - name: Check the signature, notarize the disk image (macOS)
        if: steps.signing.outputs.signed == 'true'
        run: |
          bundle="target/$TARGET/release/bundle"
          app="$bundle/macos/Mirsam.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for file in "$app/Contents/MacOS/"* "$app/Contents/Frameworks/libpdfium.dylib"; do
            details="$(codesign -dv --verbose=2 "$file" 2>&1)"
            grep -q "^Authority=Developer ID Application" <<< "$details" \
              || { echo "::error::$file is not signed with the Developer ID:"; echo "$details"; exit 1; }
            # Notarization needs the hardened runtime on executables, not libraries.
            [[ "$file" == *.dylib ]] || grep -q "flags=.*runtime" <<< "$details" \
              || { echo "::error::$file is signed without the hardened runtime"; exit 1; }
          done
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

          shopt -s nullglob
          dmgs=("$bundle"/dmg/*.dmg)
          [[ ${#dmgs[@]} -eq 1 ]] || { echo "::error::expected one disk image, found ${#dmgs[@]}"; exit 1; }
          dmg="${dmgs[0]}"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then
            auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          else
            auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          fi
          result="$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --output-format json)"
          echo "$result"
          if [[ "$(jq -r .status <<< "$result")" != Accepted ]]; then
            xcrun notarytool log "$(jq -r .id <<< "$result")" "${auth[@]}" || true
            echo "::error::Apple did not accept the disk image for notarization"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

          # The app inside the disk image is the one people install.
          mount="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mount" "$dmg"
          xcrun stapler validate "$mount/Mirsam.app"
          spctl --assess --type execute --verbose=2 "$mount/Mirsam.app"
          hdiutil detach "$mount" -quiet

      # Names without a version, so releases/latest/download/<name> links keep
      # working from one release to the next.
      - name: Name the downloads
        run: |
          bundle="target/$TARGET/release/bundle"
          mkdir -p dist
          one() {
            shopt -s nullglob
            local found=($1)
            [[ ${#found[@]} -eq 1 ]] || { echo "::error::expected one $1, found ${#found[@]}"; exit 1; }
            cp "${found[0]}" "dist/$2"
          }
          case "$TARGET" in
            *-apple-darwin)
              one "$bundle/dmg/*.dmg" Mirsam-macOS.dmg
              echo "${{ steps.signing.outputs.signed }}" > dist/macos-signed.txt ;;
            *-windows-msvc)
              one "$bundle/nsis/*-setup.exe" Mirsam-Windows-Setup.exe
              one "$bundle/msi/*.msi" Mirsam-Windows.msi ;;
            *-linux-gnu)
              one "$bundle/deb/*.deb" Mirsam-Linux-x86_64.deb
              one "$bundle/rpm/*.rpm" Mirsam-Linux-x86_64.rpm
              one "$bundle/appimage/*.AppImage" Mirsam-Linux-x86_64.AppImage ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          [[ -n "${SIGNING_KEYCHAIN:-}" ]] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  release:
    name: Draft the GitHub Release
    needs: [prepare, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          macos_signed="$(cat dist/macos-signed.txt)"
          rm dist/macos-signed.txt
          (cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          node -e '
            const fs = require("node:fs");
            const [template, version, signed, repo] = process.argv.slice(1);
            const drop = signed === "true" ? "unsigned" : "signed";
            let notes = fs.readFileSync(template, "utf8")
              .replace(new RegExp(`<!-- macos:${drop} -->[\\s\\S]*?<!-- /macos:${drop} -->\\n?`, "g"), "")
              .replace(/<!-- \/?macos:(signed|unsigned) -->\n?/g, "")
              .replaceAll("{{VERSION}}", version)
              .replaceAll("{{REPO}}", repo);
            fs.writeFileSync("release-notes.md", notes);
          ' .github/release-notes.md "$VERSION" "$macos_signed" "$GITHUB_REPOSITORY"
          cat release-notes.md
      - name: Create or update the draft
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            prerelease=()
            [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag "${prerelease[@]}" \
              --title "Mirsam $VERSION" --notes-file release-notes.md --generate-notes
          fi
          echo "Draft ready: review it and press Publish at https://github.com/$GITHUB_REPOSITORY/releases" >> "$GITHUB_STEP_SUMMARY"
