name: CI

# Changes to documentation alone run nothing. THIRD_PARTY_LICENSES.md is
# generated from the dependencies and checked by the licence job, so it counts
# as code. "Run workflow" on the Actions tab runs everything on any branch.
#
# Standard runners are free while the repository is public. If it goes private
# again, minutes come out of a small monthly allowance and a macOS minute costs
# about ten Linux ones. Then drop macOS from pull requests first (the Test
# matrix and the macOS shell self-test): development happens on a Mac, and
# pushes to main would still cover it.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "THIRD_PARTY_LICENSES.md"
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "THIRD_PARTY_LICENSES.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: "true"

jobs:
  licences:
    name: Licence policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: THIRD_PARTY_LICENSES.md is current and every licence is allowed
        run: node scripts/third-party-licenses.mjs --check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential file qpdf
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install qpdf
      - name: System packages (Windows)
        if: runner.os == 'Windows'
        run: choco install qpdf --no-progress -y

      # rust-toolchain.toml pins the version and components.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Fetch PDFium (pinned, checksum-verified)
        run: scripts/fetch-pdfium.sh

      - name: Install UI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/desktop

      - name: UI lint, typecheck, unit tests, build
        working-directory: apps/desktop
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      # axe-core over the main screens in headless Chrome (the runner image's,
      # as for the fixture corpus), with real rendering so colour contrast is
      # checked. One platform is enough: the UI is the same on all three.
      - name: "Accessibility in Chrome (axe: en/ar, light/dark)"
        id: a11y
        if: runner.os == 'Linux'
        run: node scripts/a11y-check.mjs --out a11y-report
      - uses: actions/upload-artifact@v4
        if: failure() && steps.a11y.outcome == 'failure'
        with:
          name: a11y-report
          path: a11y-report

      - name: Generate the fixture corpus
        run: node fixtures/generate.mjs

      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust lint (release surface)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust lint (devtools surface)
        run: cargo clippy --workspace --all-targets --locked --features safha-desktop/devtools -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
      # Each platform's Chrome lays out the fixtures a little differently;
      # keep the PDFs a failure was measured on.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fixtures-${{ matrix.os }}
          path: fixtures/out

  shell-selftest:
    name: Desktop shell self-test (macOS)
    runs-on: macos-latest
    # Launches the real app and checks that PDFium output reaches the canvas in
    # both directions. A required check, green on every recent run.
    steps:
      - uses: actions/checkout@v4
      - run: brew install qpdf
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: scripts/fetch-pdfium.sh
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: node fixtures/generate.mjs
      - run: cargo build -p safha-desktop --features devtools --locked
      # The first launch of a freshly built binary on a fresh runner pays
      # one-time costs (macOS checks the new executable, caches are cold): on
      # the first CI run it took 461 ms to the first preview, the next launch
      # 53 ms. Launch once unmeasured so the budget applies to the app.
      - name: Warm-up launch (not checked)
        run: scripts/selftest.sh fixtures/out/chrome/mixed-inline.pdf selftest-out/warmup en light || true
      - name: English, light
        run: scripts/selftest.sh fixtures/out/chrome/mixed-inline.pdf selftest-out/en en light
      - name: Arabic, dark
        run: scripts/selftest.sh fixtures/out/coretext/contract-two-column.pdf selftest-out/ar ar dark
      - name: Check the reports
        run: node scripts/check-selftest.mjs selftest-out/en ltr --ci && node scripts/check-selftest.mjs selftest-out/ar rtl --ci
      # Timing on a virtual machine says little about real hardware, so the
      # time budgets only warn here; the shell's memory still fails the run.
      - name: Scroll and zoom budgets, 1,000-page document (spec section 11)
        run: scripts/scroll-benchmark.sh selftest-out/scroll debug --ci
      # Spec section 11's first-page budget names a 100-page text document.
      - name: First page of a 100-page document
        run: |
          scripts/selftest.sh fixtures/out/derived/bilingual-100-pages.pdf selftest-out/hundred en light
          node scripts/check-selftest.mjs selftest-out/hundred ltr --ci
      # A Rust panic becomes a redacted report, offered at the next start (ADR 0061).
      - name: Crash report after a panic
        run: scripts/crash-selftest.sh selftest-out/crash panic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-selftest
          path: selftest-out

  shell-selftest-other:
    name: Desktop shell self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The same end-to-end check on WebKitGTK (Linux, under a virtual X server)
    # and WebView2 (Windows): tiles over the custom scheme, selection, search,
    # thumbnails, a second window, in both UI directions. Required, like the
    # macOS one. Installers are checked the same way in bundle.yml.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      # WebKitGTK in a virtual machine: no GPU, no DMA-BUF.
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential file qpdf xvfb
      - name: Virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1600x1200x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: System packages (Windows)
        if: runner.os == 'Windows'
        run: choco install qpdf --no-progress -y
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: scripts/fetch-pdfium.sh
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - run: node fixtures/generate.mjs
      - run: cargo build -p safha-desktop --features devtools --locked
      - name: Warm-up launch (not checked)
        run: scripts/selftest.sh fixtures/out/chrome/mixed-inline.pdf selftest-out/warmup en light || true
      - name: English, light
        run: scripts/selftest.sh fixtures/out/chrome/mixed-inline.pdf selftest-out/en en light
      # Three pages, so the self-test also drives the page organizer.
      - name: Arabic, dark
        run: scripts/selftest.sh fixtures/out/derived/page-labels.pdf selftest-out/ar ar dark
      - name: Check the reports
        run: node scripts/check-selftest.mjs selftest-out/en ltr --ci && node scripts/check-selftest.mjs selftest-out/ar rtl --ci
      - name: Crash report after a panic
        run: scripts/crash-selftest.sh selftest-out/crash panic
      # GTK's print path, exported to a file instead of the dialog (ADR 0013):
      # four pages turned 0, 90, 180 and 270 degrees must all come out.
      - name: Print through GTK to a file (Linux)
        if: runner.os == 'Linux'
        env:
          SAFHA_SELFTEST_SPIKE: print
        run: |
          SAFHA_PRINT_EXPORT="$PWD/selftest-out/print/printed.pdf" \
            scripts/selftest.sh fixtures/out/derived/rotated.pdf selftest-out/print en light
          cat selftest-out/print/report.json
          node -e 'const r = require("./selftest-out/print/report.json").results; if (r.error) { console.error(r.error); process.exit(1); }'
          pages="$(qpdf --show-npages selftest-out/print/printed.pdf)"
          echo "printed $pages pages, $(wc -c < selftest-out/print/printed.pdf) bytes"
          test "$pages" = 4
          # Small previews of what was printed, for the uploaded artifact.
          for page in 0 1 2 3; do
            cargo run -q -p safha-core --example render_png -- \
              selftest-out/print/printed.pdf "selftest-out/print/page-$page.png" "$page" 0.4
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-selftest-${{ matrix.os }}
          path: selftest-out

  search-budget:
    name: Search budget, 500 pages (Linux)
    runs-on: ubuntu-latest
    # Spec section 11: in-document search within 1 s on 500 pages once the
    # index exists, measured on a release build. A laptop takes about 10 ms,
    # so unlike the frame budgets this one fails the run on a virtual machine.
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y qpdf
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: scripts/fetch-pdfium.sh
      - run: node fixtures/generate.mjs
      - name: Search 500 pages (release build)
        run: |
          export SAFHA_PDFIUM_DIR="$PWD/third_party/pdfium/linux-x64/lib"
          cargo run --release --locked -p safha-core --example search_bench -- \
            fixtures/out/derived/bilingual-500-pages.pdf --budget-ms 1000 \
            Agreement الإيجار 4,500 the مختلط
