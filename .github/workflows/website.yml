# The website (website/, deployed by Vercel from main): string parity between
# English and Arabic, type check and build. The Rust and desktop pipelines
# ignore website/ (ci.yml, bundle.yml).
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "apps/desktop/package.json"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "apps/desktop/package.json"
      - ".github/workflows/website.yml"

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
