[package]
name = "spike-pades"
description = "M5 spike (throwaway): PAdES certificate signatures with RustCrypto's CMS stack (ADR 0044)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# RustCrypto (MIT OR Apache-2.0). cms 0.3 is a release candidate: the 0.2 line
# is tied to rsa 0.9, which has the Marvin timing leak (RUSTSEC-2023-0071).
cms = { version = "=0.3.0-rc.2", features = ["builder", "std"] }
x509-cert = { version = "0.3.1", features = ["builder", "std", "pem"] }
x509-verify = { version = "0.4.10", features = ["std", "x509", "pem", "ecdsa", "rsa", "sha2"] }
x509-tsp = "=0.2.0-rc.0"
der = { version = "0.8", features = ["std", "pem", "oid"] }
spki = { version = "0.8", features = ["std", "pem"] }
pkcs8 = { version = "0.11", features = ["std", "pem"] }
const-oid = "0.10"
rsa = { version = "0.10", features = ["encoding"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] }
sha2 = "0.11"
signature = "3"
lopdf = { version = "0.47", default-features = false }

[lints]
