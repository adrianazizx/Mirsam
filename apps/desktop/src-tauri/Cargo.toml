[package]
name = "safha-desktop"
description = "Safha desktop shell (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The _lib suffix keeps the library and binary names distinct, which Windows needs.
name = "safha_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Developer-only commands: the self-test harness and the Milestone 0 spikes.
# Never enabled in release bundles.
devtools = ["dep:base64"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
safha-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
base64 = { version = "0.22", optional = true }

# Printing on Linux (ADR 0013). Tauri already builds on GTK 3 there; this is the
# same crate and version its window toolkit uses.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[lints]
workspace = true
