[package]
name = "safha-core"
description = "UI-independent PDF engine: document model, rendering, text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
pdfium-render = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
unicode-bidi = "0.3.18"
unicode-normalization = "0.1.26"
regex = { version = "1.13", default-features = false, features = ["std", "unicode", "perf"] }
# Bundled: the same SQLite on every platform, no system library needed.
rusqlite = { version = "0.43", features = ["bundled"] }
# Inflate for the catalog reader's object and cross-reference streams; it can
# cap the decompressed size, which untrusted input needs.
miniz_oxide = "0.9"
# The standard security handler, to encrypt objects an edit adds to an
# encrypted file (pdf/crypt.rs). RustCrypto, MIT OR Apache-2.0; the same
# versions Tauri's dependencies already bring in.
aes = "0.9"
md-5 = "0.11"
sha2 = "0.11"
getrandom = "0.3"
# Text layout for writing (ADR 0020). harfrust: the maintained HarfBuzz port (MIT);
# ICU4X (Unicode-3.0, already in the tree through harfrust and Tauri) for UAX #14
# line breaks, grapheme clusters, and the Script / Script_Extensions properties.
harfrust = "0.16.1"
icu_segmenter = { version = "2.4", default-features = false, features = ["compiled_data"] }
icu_properties = "2.4"
subsetter = "0.2.6"
read-fonts = "0.47.0"
# OCR (ADR 0032): llama-server runs as a child process and is spoken to over
# localhost HTTP, blocking, through ureq (MIT OR Apache-2.0). Page images go to
# it as base64 PNGs. The model downloads (models/, ADR 0034) use ureq too, over
# HTTPS: rustls on ring with the operating system's trust store, read by
# rustls-native-certs (rustls-platform-verifier would pull in a CDLA-licensed
# root list for wasm32). Localhost requests stay plain HTTP.
ureq = { version = "3.5.2", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
base64 = "0.23.1"
# PNG (MIT OR Apache-2.0): image signatures (ADR 0045), OCR page images (ADR 0032),
# page export and image watermarks (ADR 0050).
png = "0.18"
# The llama.cpp runtime's .tar.gz builds are unpacked by tar on flate2
# (miniz_oxide); its Windows .zip builds by models/archive.rs. fs4 asks the OS
# for free disk space without `unsafe` here. All MIT OR Apache-2.0.
flate2 = "1.1.11"
tar = { version = "0.4.46", default-features = false }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
serde_json = { workspace = true }
# Certificate signatures (PAdES, ADRs 0044 and 0048): RustCrypto's CMS, X.509,
# RFC 3161 and key crates, all MIT OR Apache-2.0. `cms` and `x509-tsp` are
# release candidates, pinned: the stable cms 0.2 line needs rsa 0.9, whose
# private-key operations leak timing (RUSTSEC-2023-0071); rsa 0.10 does not.
cms = { version = "=0.3.0-rc.2", features = ["builder", "std"] }
x509-cert = { version = "0.3.1", default-features = false, features = ["builder", "std"] }
x509-tsp = "=0.2.0-rc.0"
# Checks a signature with a certificate's key; only the algorithms PDF signers
# use (RSA, ECDSA P-256 and P-384), not every curve its defaults bring.
x509-verify = { version = "0.4.10", default-features = false, features = ["std", "x509", "sha2", "rsa", "p256", "p384"] }
der = { version = "0.8", features = ["std", "oid"] }
spki = { version = "0.8", features = ["std"] }
pkcs8 = { version = "0.11", features = ["std"] }
const-oid = { version = "0.10", features = ["db"] }
signature = "3"
# Only to compare an older signer's ESS v1 certificate hash (already in the tree
# through x509-cert's builder); nothing is signed or trusted on SHA-1.
sha1 = "0.11"
rsa ={ version = "0.10", features = ["encoding", "pkcs1v15"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
# PKCS#12 (.p12/.pfx) files: PBES2 (AES) and the legacy 3DES/RC2 schemes that
# Windows and older macOS exports still use; the MAC tells a wrong password.
p12-keystore = "0.4.1"

# The macOS keychain's signing identities (ADR 0048): the key stays in the
# keychain, which signs. Already in the tree through rustls-native-certs.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[lints]
workspace = true

[dev-dependencies]
unicode-normalization = "0.1.26"
