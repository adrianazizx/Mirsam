[workspace]
resolver = "3"
members = ["crates/mirsam-core", "crates/mirsam-ocr-eval", "apps/desktop/src-tauri", "spikes/pdfium-edit", "spikes/pdfium-regenerate", "spikes/editor-surface", "spikes/pades"]
# Spikes are throwaway prototypes: built on demand, never part of the default build.
default-members = ["crates/mirsam-core", "crates/mirsam-ocr-eval", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
mirsam-core = { path = "crates/mirsam-core" }
# The pdfium_NNNN feature must match PDFIUM_BUILD in scripts/fetch-pdfium.sh.
pdfium-render = { version = "=0.9.6", default-features = false, features = ["pdfium_8125", "thread_safe"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"

# Dependencies (PDFium bindings, image codecs) are unusably slow unoptimized.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
# Debug information goes; the symbol table stays, so a crash report's stack
# names functions (ADR 0061). It adds 0.6 MB to the macOS installer.
strip = "debuginfo"
